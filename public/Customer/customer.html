
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer</title>
</head>

<body>

    <center>
        <table>
            <tr>
                <td>Customer</td>
            </tr>
        </table>
    </center>

    <form id="customerForm">

        <center>
            <table>

                <tr>
                    <td>Customer Code :</td>
                    <td>
                        <input type="text" id="customerCode"
                            placeholder="Enter Your Customer Code" required>
                    </td>
                </tr>

                <tr>
                    <td>Customer Type :</td>
                    <td>
                        <input type="text" id="customerType"
                            placeholder="Enter the Customer Type" required>
                    </td>
                </tr>

                <tr>
                    <td>Customer Name :</td>
                    <td>
                        <input type="text" id="customerName"
                            placeholder="Enter Your Customer Name" required>
                    </td>
                </tr>

                <tr>
                    <td>Customer Contact :</td>
                    <td>
                        <input type="tel" id="customerContact"
                            placeholder="Enter Your Mobile Number" required>
                    </td>
                </tr>

                <tr>
                    <td>Customer Mail :</td>
                    <td>
                        <input type="email" id="customerMail"
                            placeholder="Enter Your Email">
                    </td>
                </tr>

                <tr>
                    <td>GSTIN :</td>
                    <td>
                        <input type="text" id="gstin"
                            placeholder="Enter Your GSTIN">
                    </td>
                </tr>

            </table>
        </center>

        <center>
            <button type="submit" id="submitBtn">Submit</button>
            <button type="reset">Reset</button>
        </center>

    </form>


    <script src="customer.js"></script>

</body>

</html>
