
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry</title>
</head>
<body>

    <center>
        <h2>Enquiry</h2>

        <form id="enquiryForm">
            <table>
                <tr>
                    <td>Enquiry No:</td>
                    <td><input type="text" id="enquiryNo" placeholder="Enter Your Enquiry Number" required></td>
                </tr>

                <tr>
                    <td>Enquiry Date:</td>
                    <td><input type="date" id="enquiryDate" required></td>
                </tr>

                <tr>
                    <td>Company Name:</td>
                    <td><input type="text" id="companyName" placeholder="Enter Your Company Name" required></td>
                </tr>

                <tr>
                    <td>Mobile No:</td>
                    <td><input type="tel" id="mobileNo" placeholder="Enter Your Mobile Number" required></td>
                </tr>

                <tr>
                    <td>Leadsource:</td>
                    <td><input type="text" id="leadSource" placeholder="Enter Your Leadsource" required></td>
                </tr>

                <tr>
                    <td>Enquiry Category:</td>
                    <td><input type="text" id="enquiryCategory" placeholder="Enter Your Category" required></td>
                </tr>
            </table>

            <br>
<button type="submit" id="submitBtn">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </center>

    <script src="enquiry.js"></script>
    
</body>
</html>
